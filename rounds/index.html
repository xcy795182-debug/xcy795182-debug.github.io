<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#176c73"><title>儿科查房本 · 本地原型</title>
<style>
:root{--ink:#233b42;--sub:#5a6f76;--line:#d6e2e5;--bg:#f3f7f8;--teal:#176c73;--soft:#e4f1f1;--warn:#80500d;--danger:#a33b32}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit;color:inherit;max-width:100%}button{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fff;cursor:pointer}button:disabled{opacity:.45;cursor:default}button.primary,.tabs button.active{background:var(--teal);color:#fff;border-color:var(--teal)}button.danger{color:var(--danger)}input,select,textarea{width:100%;min-height:44px;padding:10px;border:1px solid #b9cdd2;border-radius:9px;background:#fff;margin:5px 0 12px}textarea{min-height:90px;resize:vertical}input[type=checkbox]{width:22px;height:22px;min-height:0;margin:0;accent-color:var(--teal)}h1{font-size:25px;margin:0}h2{font-size:21px;margin:0 0 12px}h3{font-size:18px;margin:0}p{margin:8px 0}small,.muted{color:var(--sub);font-size:13px}header{background:#fff;border-bottom:1px solid var(--line);padding:18px max(16px,env(safe-area-inset-left)) 14px}header>div,.wrap{max-width:900px;margin:auto}.wrap{padding:16px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.actions,.tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tabs{margin:14px 0}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.badge{display:inline-block;padding:4px 8px;border-radius:7px;background:#edf3f4;font-size:13px}.badge.warn{background:#fff0dc;color:var(--warn)}.bedcard{display:block;text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px;margin-bottom:12px}.bedcard .row{margin-bottom:7px}.bedcard strong{font-size:20px;font-weight:600}.record{padding:15px 0;border-bottom:1px solid var(--line)}.record:last-child{border-bottom:0}.record.done{opacity:.7}.tasklabel{display:flex;align-items:flex-start;gap:12px}.notice{background:#e8f3f3;padding:10px 14px;border-radius:9px;margin:12px 0}.error{color:var(--danger)}[hidden]{display:none!important}details>summary{min-height:44px;cursor:pointer;align-content:center}canvas{display:block;width:100%;height:220px;background:repeating-linear-gradient(#fff,#fff 31px,#e4ecee 32px);border:1px solid var(--line);border-radius:10px;touch-action:none}canvas.large{height:400px}.footnav{margin:16px 0;padding:14px 0;border-top:1px solid var(--line)}dialog{border:0;border-radius:15px;width:min(600px,calc(100% - 24px));max-height:90dvh;overflow:auto;padding:22px;color:var(--ink)}dialog::backdrop{background:#14353b66}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}.tablewrap{overflow:auto}label{display:block}.tablewrap input{min-width:80px}.status{font-size:13px}#toast{position:sticky;bottom:12px;z-index:4;box-shadow:0 3px 18px #233b4222}a{color:var(--teal)}.topnote{font-size:13px;color:var(--sub);margin-top:8px}.split{display:flex;align-items:center;gap:8px}.split input{margin:0;width:22px;min-height:22px}.metric{font-variant-numeric:tabular-nums}@media(max-width:550px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.panel{padding:14px}header{padding:14px}.actions button{flex-grow:1}dialog{padding:16px}h1{font-size:23px}}
</style></head><body>
<header><div><div class="row"><h1>儿科查房本</h1><span id="save-state" class="status" role="status">正在读取…</span></div><div class="row" style="margin-top:10px"><div class="actions"><button data-action="home">病人总览</button><button data-action="alltasks">全部待办</button><button data-action="settings">备份与设置</button></div><span id="today-label" class="muted"></span></div><p class="topnote">本地原型 · 手动记录与追踪 · 医嘱须在医院系统实际下达</p></div></header>
<main class="wrap"><div id="screen"></div><div id="toast" class="notice" role="status" hidden></div></main>
<dialog id="modal"><div class="row"><h2 id="modal-title"></h2><button id="close-modal" type="button">关闭</button></div><div id="modal-body"></div></dialog>
<script>
'use strict';
const KEY='pediatric-rounds-v1',VERSION=1,$=s=>document.querySelector(s),screen=$('#screen');
const uid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const localDate=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const today=localDate();$('#today-label').textContent=today;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateDiff=(a,b)=>Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000)+1;
const empty=()=>({version:VERSION,patients:[],trash:[],custom:[],favorites:[],lastBackup:null});
let db=empty(),view='home',pid=null,tab='today',filter='all',saveOK=true,loadFailed=false,timer;
try{const saved=localStorage.getItem(KEY);if(saved){db=JSON.parse(saved);validate(db);}}catch(e){db=empty();loadFailed=true;saveOK=false;$('#save-state').textContent='读取失败 · 请勿覆盖原数据';}
function validate(d){if(!d||d.version!==VERSION||!Array.isArray(d.patients)||!Array.isArray(d.trash)||!Array.isArray(d.custom)||!Array.isArray(d.favorites))throw Error('备份格式或版本不支持');const ids=new Set();for(const p of [...d.patients,...d.trash]){if(!p||typeof p.id!=='string'||ids.has(p.id)||typeof p.bed!=='string'||!p.bed.trim()||!p.days||typeof p.days!=='object'||Array.isArray(p.days)||!Array.isArray(p.records)||!Array.isArray(p.meds)||!Array.isArray(p.tasks)||!Array.isArray(p.monitor))throw Error('患儿资料结构不完整');ids.add(p.id);for(const r of p.records)if(!r||!['lab','exam'].includes(r.type)||!Array.isArray(r.parts))throw Error('检查检验结构不完整');}const beds=d.patients.map(p=>norm(p.bed));if(new Set(beds).size!==beds.length)throw Error('存在重复床号');}
function persist(){if(loadFailed){$('#save-state').textContent='读取失败 · 已暂停写入';return false;}try{localStorage.setItem(KEY,JSON.stringify(db));saveOK=true;$('#save-state').textContent='已本地保存 '+new Date().toLocaleTimeString('zh-CN',{hour12:false});$('#save-state').classList.remove('error');return true;}catch(e){saveOK=false;$('#save-state').textContent='保存失败 · 请立即导出备份';$('#save-state').classList.add('error');return false;}}
function toast(t){clearTimeout(timer);$('#toast').textContent=t;$('#toast').hidden=false;timer=setTimeout(()=>$('#toast').hidden=true,6000);}
const patient=()=>db.patients.find(p=>p.id===pid);
function norm(b){let s=String(b).normalize('NFKC').trim().replace(/床$/,'').trim();return /^\d+$/.test(s)?s.replace(/^0+(?=\d)/,'').padStart(2,'0'):s;}
const sorted=()=>[...db.patients].sort((a,b)=>a.bed.localeCompare(b.bed,'zh-CN',{numeric:true}));
function day(p,d=today){return p.days[d]||(p.days[d]={change:'',ink:''});}
const statusList=['待下达','待完成','待结果','待阅','已阅','取消'];
const lib={
'血液学':['血常规','网织红细胞','外周血涂片'],
'炎症指标':['CRP','PCT','血沉','血清淀粉样蛋白A'],
'肝功能':['肝功能组合','ALT','AST','总胆红素','直接胆红素','白蛋白','总蛋白','GGT','ALP'],
'肾功能与电解质':['肾功能组合','电解质组合','尿素','肌酐','尿酸','钠','钾','氯','钙','镁','磷'],
'凝血与DIC':['凝血功能组合','DIC相关组合','PT','INR','APTT','TT','纤维蛋白原','D-二聚体','FDP'],
'血气与代谢':['血气分析','乳酸','血氨','血糖','血酮','糖化血红蛋白','血脂组合'],
'心肌及心功能':['心肌酶组合','肌钙蛋白','BNP','NT-proBNP'],
'尿液与粪便':['尿常规','尿蛋白/肌酐比','24小时尿蛋白','便常规','粪便隐血','粪钙卫蛋白'],
'病原学':['血培养','尿培养','痰培养','粪培养','涂片检查','呼吸道病原核酸','病原抗原检测','病原抗体检测'],
'脑脊液':['脑脊液常规','脑脊液生化','脑脊液培养','脑脊液病原核酸','脑脊液专项检查'],
'骨髓穿刺相关':['骨髓细胞学','骨髓流式细胞术','骨髓细胞遗传学','骨髓分子检测'],
'宏基因组测序':['二代宏基因组测序（mNGS）'],
'免疫与专项':['免疫球蛋白','补体C3/C4','抗核抗体','自身抗体谱','铁蛋白','铁代谢组合','溶血相关检查','甲状腺功能','皮质醇'],
'其他体液':['胸水常规','胸水生化','胸水培养','腹水常规','腹水生化','腹水培养'],
'放射':['胸部X线','腹部X线','胸部CT','头颅CT','腹部CT','头颅MRI','脊柱MRI'],
'超声':['腹部超声','泌尿系超声','心脏超声','浅表组织超声','血管超声','颅脑超声'],
'内镜':['支气管镜','胃镜','肠镜']};
const groups={lab:Object.keys(lib).filter(k=>!['放射','超声','内镜'].includes(k)),exam:['放射','超声','内镜']};
const combos={'血常规':['白细胞','中性粒细胞比例','淋巴细胞比例','血红蛋白','血小板'],'肝功能组合':['ALT','AST','总胆红素','直接胆红素','白蛋白','总蛋白','GGT','ALP'],'肾功能组合':['尿素','肌酐','尿酸'],'电解质组合':['钠','钾','氯','钙','镁','磷'],'凝血功能组合':['PT','INR','APTT','TT','纤维蛋白原'],'DIC相关组合':['PT','INR','APTT','TT','纤维蛋白原','D-二聚体','FDP'],'脑脊液生化':['脑脊液蛋白','脑脊液葡萄糖','脑脊液氯']};
const units={'白细胞':'×10⁹/L','中性粒细胞比例':'%','淋巴细胞比例':'%','血红蛋白':'g/L','血小板':'×10⁹/L','CRP':'mg/L','PCT':'ng/mL','ALT':'U/L','AST':'U/L','白蛋白':'g/L'};
function pending(p,type){return p.records.filter(r=>r.type===type&&!['取消','待下达'].includes(r.status)&&r.parts.some(x=>x.state==='待阅')).length;}
function outstanding(p){return p.meds.some(m=>!m.issued&&!m.stop)||p.tasks.some(t=>!t.done)||p.records.some(r=>r.status!=='取消'&&(r.status==='待下达'||r.parts.some(x=>!['已阅','取消'].includes(x.state))));}
function badges(p){return `<span class="badge warn">待阅检查 ${pending(p,'exam')}</span> <span class="badge warn">待阅结果 ${pending(p,'lab')}</span>`;}
function openModal(title,html,handler){$('#modal-title').textContent=title;$('#modal-body').innerHTML=html;if(handler)handler();$('#modal').showModal();}
$('#close-modal').onclick=()=>$('#modal').close();
function err(form,text){form.querySelector('[role=alert]').textContent=text;}
const field=(label,name,value='',type='text',required=false)=>`<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></label>`;
const textfield=(label,name,value='')=>`<label>${label}<textarea name="${name}">${esc(value)}</textarea></label>`;
function formEnd(label='保存'){return `<p role="alert" class="error"></p><button class="primary" type="submit">${label}</button>`;}
function render(){if(view==='home')renderHome();if(view==='patient')renderPatient();if(view==='tasks')renderTasks();if(view==='settings')renderSettings();}
function goHome(){view='home';pid=null;render();}
function renderHome(){screen.innerHTML=`<div class="row"><h2>我的病人</h2><button class="primary" data-action="addpatient">＋ 新增患儿</button></div><div class="tabs"><button data-filter="all" class="${filter==='all'?'active':''}">全部病人</button><button data-filter="pending" class="${filter==='pending'?'active':''}">有待处理</button><span class="muted">${db.patients.length}位 · 按床号排列</span></div><div id="bed-list"></div>${db.trash.length?`<div class="notice">已删除记录 ${db.trash.length}份，可在“备份与设置”恢复。</div>`:''}`;const ps=sorted().filter(p=>filter==='all'||outstanding(p));$('#bed-list').innerHTML=ps.map(p=>`<button class="bedcard" data-open="${esc(p.id)}"><div class="row"><strong>${esc(p.bed)}床</strong><span>${esc(p.age||'年龄待补充')}</span></div><p>${esc(p.diagnosis||'诊断待补充')}</p>${badges(p)}<p class="muted">重点：${esc(p.focus||'待补充')}</p></button>`).join('')||'<div class="panel muted">暂无患儿。新增时仅填写床号即可。</div>';}
function addPatient(){openModal('新增患儿',`<form id="newpatient">${field('床号（必填）','bed','','text',true)}${field('年龄（可后补，例如3岁2月）','age')}${formEnd('新增')}</form>`,()=>{$('#newpatient').onsubmit=e=>{e.preventDefault();const f=e.target,d=new FormData(f),bed=norm(d.get('bed'));if(!bed||bed.length>30)return err(f,'请填写30字以内的床号。');if(db.patients.some(p=>norm(p.bed).toLowerCase()===bed.toLowerCase()))return err(f,'该床号已存在。');db.patients.push({id:uid(),bed,age:d.get('age').trim(),diagnosis:'',focus:'',summary:'',weight:'',weightDate:'',created:today,days:{},tasks:[],records:[],meds:[],monitor:[],monitorEnabled:false});persist();$('#modal').close();goHome();};});}
function renderPatient(){const p=patient();if(!p)return goHome();const ps=sorted(),i=ps.findIndex(x=>x.id===pid);screen.innerHTML=`<section class="panel"><div class="row"><h2>${esc(p.bed)}床 <small>${esc(p.age||'年龄待补充')}</small></h2><div class="actions"><button data-action="editpatient">基本信息</button><button class="danger" data-action="deletepatient">删除患儿</button></div></div><p>${esc(p.diagnosis||'诊断待补充')} ${p.weight?`<small>｜体重 ${esc(p.weight)} kg · ${esc(p.weightDate||'日期未填')}</small>`:''}</p><p>重点：${esc(p.focus||'待补充')}</p>${badges(p)}</section><nav class="tabs">${[['today','今日'],['history','病情'],['exam','检查'],['lab','检验'],['med','用药']].map(([k,n])=>`<button data-tab="${k}" class="${tab===k?'active':''}">${n}</button>`).join('')}</nav><div id="content"></div><div class="row footnav"><button data-neighbor="${i-1}" ${i===0?'disabled':''}>‹ 上一床</button><span class="muted">${i+1} / ${ps.length}</span><button data-neighbor="${i+1}" ${i===ps.length-1?'disabled':''}>下一床 ›</button></div>`;if(tab==='today')renderToday(p);if(tab==='history')renderHistory(p);if(['exam','lab'].includes(tab))renderRecords(p,tab);if(tab==='med')renderMeds(p);}
function editPatient(){const p=patient();openModal('基本信息',`<form id="basic">${field('床号','bed',p.bed,'text',true)}${field('年龄','age',p.age)}<div class="grid">${field('体重（kg）','weight',p.weight,'number')}${field('体重测量日期','weightDate',p.weightDate,'date')}</div>${formEnd()}</form>`,()=>{$('#basic [name=weight]').step='any';$('#basic').onsubmit=e=>{e.preventDefault();const f=e.target,d=new FormData(f),b=norm(d.get('bed'));if(!b||db.patients.some(x=>x.id!==p.id&&norm(x.bed).toLowerCase()===b.toLowerCase()))return err(f,'床号为空或与其他患儿重复。');p.bed=b;p.age=d.get('age').trim();p.weight=d.get('weight');p.weightDate=d.get('weightDate');persist();$('#modal').close();render();};});}
function deletePatient(){const p=patient();openModal('删除患儿',`<p>将${esc(p.bed)}床及其全部记录移至可恢复删除区。</p><p class="muted">同床新入院患儿会建立独立记录。</p><button id="confirm-delete" class="danger">删除并保留恢复记录</button>`,()=>{$('#confirm-delete').onclick=()=>{db.patients=db.patients.filter(x=>x.id!==p.id);db.trash.push({...p,deletedAt:new Date().toISOString()});persist();$('#modal').close();goHome();toast('已删除，可在备份与设置中恢复。');};});}
function taskHTML(p,t){return `<div class="record ${t.done?'done':''}"><label class="tasklabel"><input type="checkbox" data-task="${esc(t.id)}" data-patient="${esc(p.id)}" ${t.done?'checked':''}><span>${esc(t.text)}<br><small>${esc(t.date)}${t.date<today&&!t.done?' · 延续待办':''}${t.source?' · '+esc(t.source):''}</small></span></label></div>`;}
function renderToday(p){const d=day(p);$('#content').innerHTML=`<section class="panel"><h3>今日病情变化</h3><textarea id="daily-change" placeholder="仅记今天的新变化，支持系统随手写输入文字">${esc(d.change)}</textarea></section><section class="panel"><div class="row"><h3>计划与医嘱</h3><button data-action="addtask">＋ 其他计划</button></div>${p.tasks.filter(t=>!t.done||t.date===today).map(t=>taskHTML(p,t)).join('')||'<p class="muted">暂无计划</p>'}<div class="actions" style="margin-top:12px"><button class="primary" data-add-record="lab">＋ 检验</button><button data-add-record="exam">＋ 检查</button><button data-action="addmed">＋ 用药</button></div><details style="margin-top:12px"><summary>今日关联医嘱</summary>${p.records.filter(r=>r.ordered===today).map(r=>`<p>${r.type==='lab'?'检验':'检查'}：${esc(r.name)} <span class="badge">${esc(r.status)}</span></p>`).join('')}${p.meds.filter(m=>m.ordered===today).map(m=>`<p>用药：${esc(m.name)} <span class="badge">${m.issued?'已下达':'待下达'}</span></p>`).join('')}</details></section><details class="panel" id="ink-details"><summary>手写速记</summary><div class="actions"><button id="ink-size">扩大书写区</button><button id="ink-undo">撤销笔画</button><button id="ink-clear">清空本日笔迹</button></div><p class="muted">自由笔迹不自动生成医嘱；展开后可用 Pencil 或手指试写。</p><canvas id="ink" width="1400" height="800" aria-label="今日手写速记"></canvas></details><section class="panel"><label class="split"><input type="checkbox" id="monitor-toggle" ${p.monitorEnabled?'checked':''}>重点监测</label><div id="monitor-content" ${p.monitorEnabled?'':'hidden'}><p class="muted">仅录入关注项，每次记录保留时间。</p><button data-action="addmonitor">＋ 监测记录</button>${monitorHTML(p)}</div></section>`;$('#daily-change').oninput=e=>{d.change=e.target.value;persist();};$('#monitor-toggle').onchange=e=>{p.monitorEnabled=e.target.checked;persist();$('#monitor-content').hidden=!p.monitorEnabled;};setupInk(p,d);}
function setupInk(p,d){const c=$('#ink'),ctx=c.getContext('2d'),undo=[];let drawing=false,ready=true;function load(src){ctx.clearRect(0,0,c.width,c.height);if(!src)return;ready=false;const image=new Image();image.onload=()=>{ctx.drawImage(image,0,0,c.width,c.height);ready=true;};image.onerror=()=>{ready=true;toast('手写记录读取失败，请导出备份保留原数据。');};image.src=src;}load(d.ink);const xy=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height];};function end(){if(!drawing)return;drawing=false;d.ink=c.toDataURL('image/png');persist();}c.onpointerdown=e=>{if(!ready)return;drawing=true;undo.push(c.toDataURL());if(undo.length>12)undo.shift();c.setPointerCapture(e.pointerId);const [x,y]=xy(e);ctx.strokeStyle='#233b42';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.1,y+.1);ctx.stroke();};c.onpointermove=e=>{if(!drawing)return;for(const point of e.getCoalescedEvents?.()||[e]){ctx.lineTo(...xy(point));ctx.stroke();}};c.onpointerup=end;c.onpointercancel=end;c.onlostpointercapture=end;$('#ink-size').onclick=e=>{c.classList.toggle('large');e.target.textContent=c.classList.contains('large')?'缩小书写区':'扩大书写区';};$('#ink-undo').onclick=()=>{if(!undo.length)return;d.ink=undo.pop();load(d.ink);persist();};$('#ink-clear').onclick=()=>{undo.push(c.toDataURL());ctx.clearRect(0,0,c.width,c.height);d.ink='';persist();};}
function renderHistory(p){$('#content').innerHTML=`<section class="panel"><h3>病情档案</h3><label>现病史摘要<textarea data-clinical="summary" placeholder="自由记录起病经过、症状及入院前治疗等">${esc(p.summary)}</textarea></label><label>诊断<textarea data-clinical="diagnosis" placeholder="每行一条">${esc(p.diagnosis)}</textarea></label><label>当前重点<textarea data-clinical="focus">${esc(p.focus)}</textarea></label><button data-action="refreshheader">更新顶部显示</button></section><section class="panel"><h3>每日病情变化</h3>${Object.entries(p.days).sort((a,b)=>b[0].localeCompare(a[0])).map(([dt,d])=>`<details class="record" ${dt===today?'open':''}><summary>${esc(dt)}${dt===today?' · 今日':''}</summary><p style="white-space:pre-wrap">${esc(d.change||'未记录文字')}</p>${d.ink?`<img src="${esc(d.ink)}" style="max-width:100%;background:#fff" alt="${esc(dt)}手写记录">`:''}</details>`).join('')||'<p class="muted">暂无记录</p>'}</section>`;document.querySelectorAll('[data-clinical]').forEach(t=>t.oninput=()=>{p[t.dataset.clinical]=t.value;persist();});}
function addTask(p=patient(),source=''){openModal('新增计划',`<form id="task-form">${textfield('计划内容','text')}${field('计划日期','date',today,'date',true)}${formEnd()}</form>`,()=>{$('#task-form').onsubmit=e=>{e.preventDefault();const f=e.target,d=new FormData(f);if(!d.get('text').trim())return err(f,'请填写计划。');p.tasks.push({id:uid(),text:d.get('text').trim(),date:d.get('date'),source,done:false});persist();$('#modal').close();render();};});}
function stateOf(r){if(r.status==='取消'||r.status==='待下达')return r.status;const s=r.parts.map(x=>x.state);if(s.some(x=>x==='待阅'))return '待阅';if(s.every(x=>['已阅','取消'].includes(x)))return s.some(x=>x==='已阅')?'已阅':'取消';if(s.some(x=>x==='待结果'))return '待结果';return '待完成';}
function renderRecords(p,type){const rs=p.records.filter(r=>r.type===type).sort((a,b)=>b.date.localeCompare(a.date));$('#content').innerHTML=`<section class="panel"><div class="row"><h3>${type==='lab'?'检验结果':'检查报告'}</h3><button class="primary" data-add-record="${type}">＋ ${type==='lab'?'检验':'检查'}</button></div><p class="muted">${type==='lab'?'可部分回报、部分已阅；待阅按组合计数。':'放射、超声、内镜；每次检查独立记录。'}</p><label>筛选状态<select id="record-filter"><option>全部状态</option>${statusList.map(s=>`<option>${s}</option>`).join('')}</select></label><div id="record-list"></div></section>${type==='lab'?'<section class="panel"><h3>历次重点指标对比</h3><p class="muted">仅展示已填数值且单位一致的指标；按采样／检查日期排列，不自动判断异常。</p><div id="comparison" class="tablewrap"></div></section>':''}`;function draw(){const s=$('#record-filter').value;$('#record-list').innerHTML=rs.filter(r=>s==='全部状态'||stateOf(r)===s).map(r=>`<article class="record"><div class="row"><h3>${esc(r.name)}</h3><span class="badge ${stateOf(r)==='待阅'?'warn':''}">${esc(stateOf(r))}</span></div><small>${esc(r.category)} · 计划日期 ${esc(r.date)}${r.sampleDate?' · 采样／检查 '+esc(r.sampleDate):''}${r.specimen?' · 标本 '+esc(r.specimen):''}</small><p style="white-space:pre-wrap">${esc(r.summary||'尚未录入结果摘要')}</p><p class="muted">${r.parts.map(x=>esc(x.name)+'：'+esc(x.state)).join('；')}</p><div class="actions"><button data-edit-record="${r.id}">录入结果／更新状态</button><button data-follow-record="${r.id}">＋ 后续计划</button></div></article>`).join('')||'<p class="muted">暂无该状态记录</p>';};$('#record-filter').onchange=draw;draw();if(type==='lab')compare(p);}
function compare(p){const rows=new Map();p.records.filter(r=>r.type==='lab'&&r.status!=='取消').forEach(r=>r.parts.forEach(x=>{if(x.value===''||x.value==null||!['待阅','已阅'].includes(x.state))return;const k=x.name+'|'+x.unit;if(!rows.has(k))rows.set(k,[]);rows.get(k).push({date:r.sampleDate||r.date,value:x.value,unit:x.unit,name:x.name,id:r.id});}));$('#comparison').innerHTML=rows.size?`<table><thead><tr><th>指标／单位</th><th>历次结果</th></tr></thead><tbody>${[...rows.values()].map(values=>`<tr><td>${esc(values[0].name)}<br><small>${esc(values[0].unit||'单位未填')}</small></td><td>${values.sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<div>${esc(x.date)}：<strong>${esc(x.value)}</strong></div>`).join('')}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">录入具体指标数值后在此显示。</p>';}
function allItems(type){const base=groups[type].flatMap(category=>lib[category].map(name=>({name,category})));return [...base,...db.custom.filter(x=>x.type===type)];}
function addRecord(type){const p=patient();openModal(type==='lab'?'新增检验':'新增检查',`<form id="record-form"><label>搜索项目<input id="project-search" placeholder="项目名称或分类"></label><label>项目<select id="project-pick" required></select></label><button type="button" id="favorite-toggle">收藏当前项目</button><details><summary>自定义项目</summary><div class="grid">${field('项目名称','customname')}<label>分类<select name="customcategory">${groups[type].map(g=>`<option>${esc(g)}</option>`).join('')}</select></label></div><button type="button" id="add-custom">加入项目库</button></details>${field('计划日期','date',today,'date',true)}${field('标本／部位（按需）','specimen')}<label>初始状态<select name="status">${statusList.filter(x=>x!=='取消').map(s=>`<option>${s}</option>`).join('')}</select></label><p class="muted">组合项目保存后可在结果页面调整子项。</p>${formEnd('保存并关联')}</form>`,()=>{let options=[];function draw(){const query=$('#project-search').value.trim().toLowerCase();options=allItems(type).filter(x=>(x.name+x.category).toLowerCase().includes(query)).sort((a,b)=>Number(db.favorites.includes(type+'|'+b.name))-Number(db.favorites.includes(type+'|'+a.name)));$('#project-pick').innerHTML=options.map((x,i)=>`<option value="${i}">${db.favorites.includes(type+'|'+x.name)?'★ ':''}${esc(x.name)} · ${esc(x.category)}</option>`).join('');}draw();$('#project-search').oninput=draw;$('#favorite-toggle').onclick=()=>{const x=options[Number($('#project-pick').value)];if(!x)return;const k=type+'|'+x.name;db.favorites=db.favorites.includes(k)?db.favorites.filter(v=>v!==k):[...db.favorites,k];persist();draw();};$('#add-custom').onclick=()=>{const f=$('#record-form'),name=f.elements.customname.value.trim(),category=f.elements.customcategory.value;if(!name)return err(f,'先填写自定义项目名称。');if(allItems(type).some(x=>x.name===name))return err(f,'同名项目已存在。');db.custom.push({type,name,category});persist();$('#project-search').value=name;draw();};$('#record-form').onsubmit=e=>{e.preventDefault();const f=e.target,d=new FormData(f),x=options[Number($('#project-pick').value)];if(!x)return err(f,'请选择项目。');const status=d.get('status');p.records.push({id:uid(),type,name:x.name,category:x.category,date:d.get('date'),ordered:today,sampleDate:'',specimen:d.get('specimen'),summary:'',status,parts:(combos[x.name]||[x.name]).map(name=>({id:uid(),name,state:status==='待下达'?'待完成':status,value:'',unit:units[name]||''}))});persist();$('#modal').close();render();toast('已关联到'+(type==='lab'?'检验':'检查')+'栏。');};});}
function editRecord(id){const p=patient(),r=p.records.find(x=>x.id===id);let parts=structuredClone(r.parts);openModal('结果与状态：'+r.name,`<form id="result-form"><label>医嘱／整组状态<select name="orderstate"><option ${r.status==='待下达'?'selected':''}>待下达</option><option ${!['待下达','取消'].includes(r.status)?'selected':''}>已在医院系统下达</option><option ${r.status==='取消'?'selected':''}>取消</option></select></label>${field('实际采样／检查日期','sampleDate',r.sampleDate,'date')}${textfield('结果摘要／报告结论','summary',r.summary)}<div class="row"><h3>项目与回报状态</h3><button type="button" id="mark-all">全部标记已阅</button></div><div id="part-list"></div><div class="grid">${field('新增子项名称','partname')}${field('单位','partunit')}</div><button type="button" id="add-part">＋ 子项</button>${formEnd()}</form>`,()=>{function draw(){const parent=$('#part-list');parent.innerHTML=parts.map((x,i)=>`<div class="record"><div class="row"><strong>${esc(x.name)}</strong><button type="button" data-remove-part="${i}">移除此子项</button></div><label>状态<select data-part="${i}" data-field="state">${statusList.filter(s=>s!=='待下达').map(s=>`<option ${s===x.state?'selected':''}>${s}</option>`).join('')}</select></label>${r.type==='lab'?`<div class="grid"><label>数值<input data-part="${i}" data-field="value" inputmode="decimal" value="${esc(x.value)}"></label><label>单位<input data-part="${i}" data-field="unit" value="${esc(x.unit)}"></label></div>`:''}</div>`).join('');parent.oninput=e=>{if(e.target.dataset.part!==undefined)parts[+e.target.dataset.part][e.target.dataset.field]=e.target.value;};parent.onclick=e=>{const b=e.target.closest('[data-remove-part]');if(b){if(parts.length===1)return err($('#result-form'),'至少保留一个子项。');parts.splice(+b.dataset.removePart,1);draw();}};}draw();$('#add-part').onclick=()=>{const f=$('#result-form'),name=f.elements.partname.value.trim();if(!name)return err(f,'请输入子项名称。');parts.push({id:uid(),name,unit:f.elements.partunit.value.trim(),value:'',state:'待完成'});f.elements.partname.value='';f.elements.partunit.value='';draw();};$('#mark-all').onclick=()=>{if(parts.some(x=>['待完成','待结果'].includes(x.state)))return err($('#result-form'),'存在未回报子项。请先按实际情况更新，避免将未出结果的项目误标已阅。');parts.forEach(x=>{if(x.state==='待阅')x.state='已阅';});draw();};$('#result-form').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);r.summary=d.get('summary');r.sampleDate=d.get('sampleDate');r.parts=parts;r.status=d.get('orderstate')==='取消'?'取消':d.get('orderstate')==='待下达'?'待下达':'已下达';persist();$('#modal').close();render();};});}
function medLine(m){return [m.dose,m.frequency,m.route].filter(Boolean).join(' · ');}
function renderMeds(p){$('#content').innerHTML=`<section class="panel"><div class="row"><h3>用药历程</h3><button class="primary" data-action="addmed">＋ 用药</button></div><p class="muted">开始当天计第1天；按日历日期计数，不代表实际给药次数。</p><div class="tabs"><button id="current-med" class="active">当前／计划用药</button><button id="past-med">既往疗程</button></div><div id="med-list"></div></section>`;function draw(past=false){$('#current-med').classList.toggle('active',!past);$('#past-med').classList.toggle('active',past);$('#med-list').innerHTML=p.meds.filter(m=>past?!!m.stop:!m.stop).map(m=>`<article class="record"><div class="row"><h3>${esc(m.name)}</h3><span class="badge">${m.stop?'已停用':!m.issued?'待下达':m.start>today?'计划开始':'用药第'+dateDiff(m.start,today)+'天'}</span></div><p>${esc(medLine(m))}</p><small>开始 ${esc(m.start)}${m.stop?' · 停用 '+esc(m.stop)+' · 疗程 '+dateDiff(m.start,m.stop)+'天':''}</small><div class="actions" style="margin-top:12px">${m.stop?`<button data-restart-med="${m.id}">再次使用 · 新疗程</button>`:`${!m.issued?`<button data-issue-med="${m.id}">标记已在医院系统下达</button>`:''}<button data-adjust-med="${m.id}">调整方案</button><button data-stop-med="${m.id}">停用</button>`}</div><details><summary>调整历程</summary><p>${esc(m.start)} · 初始方案 ${esc(m.initial||medLine(m))}</p>${m.history.map(h=>`<p>${esc(h.date)} · ${esc(h.text)}</p>`).join('')}</details></article>`).join('')||'<p class="muted">暂无记录</p>';};$('#current-med').onclick=()=>draw();$('#past-med').onclick=()=>draw(true);draw();}
function addMed(existing){const p=patient();openModal(existing?'再次使用 · 新建疗程':'新增用药',`<form id="med-form">${field('药名','name',existing?.name||'','text',true)}${field('每次剂量及单位','dose',existing?.dose||'','text',true)}<div class="grid">${field('频次','frequency',existing?.frequency||'','text',true)}${field('途径','route',existing?.route||'','text',true)}</div>${field('开始日期','start',today,'date',true)}<label class="split"><input name="issued" type="checkbox">已在医院系统下达</label>${formEnd()}</form>`,()=>{$('#med-form').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);const m={id:uid(),name:d.get('name').trim(),dose:d.get('dose').trim(),frequency:d.get('frequency').trim(),route:d.get('route').trim(),start:d.get('start'),issued:d.has('issued'),ordered:today,stop:null,history:[]};if(!m.name||!m.dose||!m.frequency||!m.route)return err(e.target,'请补齐药名、剂量、频次和途径。');m.initial=medLine(m);p.meds.push(m);persist();$('#modal').close();render();};});}
function changeMed(id,stop=false){const p=patient(),m=p.meds.find(x=>x.id===id);openModal(stop?'停用：'+m.name:'调整方案：'+m.name,`<form id="med-change">${stop?'':field('每次剂量及单位','dose',m.dose,'text',true)+field('频次','frequency',m.frequency,'text',true)+field('途径','route',m.route,'text',true)}${field(stop?'停用日期':'方案生效日期','date',today,'date',true)}<p class="muted">原型只记录已经生效的调整，未来计划请加入待办。</p>${formEnd()}</form>`,()=>{$('#med-change').onsubmit=e=>{e.preventDefault();const f=e.target,d=new FormData(f),dt=d.get('date');if(dt<m.start||dt>today||m.history.some(h=>h.date>dt))return err(f,'日期不能早于开始或已有调整日期，也不能晚于今天。');if(stop){m.stop=dt;m.history.push({date:dt,text:'停用'});}else{const old=medLine(m);m.dose=d.get('dose').trim();m.frequency=d.get('frequency').trim();m.route=d.get('route').trim();m.history.push({date:dt,text:old+' → '+medLine(m)});}persist();$('#modal').close();render();};});}
const vitalFields=[['temp','体温','℃'],['hr','心率','次/分'],['rr','呼吸','次/分'],['spo2','血氧','%'],['input','入量','mL'],['output','出量','mL']];
function monitorHTML(p){const rs=p.monitor.filter(r=>r.at.startsWith(today)).sort((a,b)=>b.at.localeCompare(a.at));let ins=0,outs=0;rs.forEach(r=>{ins+=Number(r.input||0);outs+=Number(r.output||0);});return `<p class="muted">当日已录入：入量 ${ins} mL · 出量 ${outs} mL（分次增量相加）</p>${rs.map(r=>`<div class="record"><strong>${esc(r.at.replace('T',' '))}</strong><p>${vitalFields.filter(([k])=>r[k]!==''&&r[k]!=null).map(([k,n,u])=>n+' '+esc(r[k])+' '+u).join(' · ')}</p><small>${esc(r.note||'')}</small><button class="danger" data-delete-monitor="${r.id}">删除此条</button></div>`).join('')}`;}
function addMonitor(){const p=patient(),now=new Date(),dt=today+'T'+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');openModal('重点监测',`<form id="vital-form">${field('记录时间','at',dt,'datetime-local',true)}<div class="grid">${vitalFields.map(([k,n,u])=>field(n+'（'+u+'）',k,'','number')).join('')}</div>${field('备注（例如尿量、输液、进食）','note')}<p class="muted">出入量填写本次增量，不能重复录入累计总量。</p>${formEnd()}</form>`,()=>{document.querySelectorAll('#vital-form input[type=number]').forEach(i=>{i.step='any';i.min='0';});$('#vital-form').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),r=Object.fromEntries(d);if(!vitalFields.some(([k])=>r[k]!==''))return err(e.target,'至少填写一个监测值。');r.id=uid();p.monitor.push(r);persist();$('#modal').close();render();};});}
function renderTasks(){screen.innerHTML=`<h2>全部待办</h2>${sorted().map(p=>{const tasks=p.tasks.filter(t=>!t.done),rs=p.records.filter(r=>r.status!=='取消'&&stateOf(r)!=='已阅'),ms=p.meds.filter(m=>!m.issued&&!m.stop);if(!tasks.length&&!rs.length&&!ms.length)return '';return `<section class="panel"><div class="row"><h3>${esc(p.bed)}床</h3><button data-open="${p.id}">进入患儿</button></div>${tasks.map(t=>taskHTML(p,t)).join('')}${rs.map(r=>`<div class="record">${r.type==='lab'?'检验':'检查'}：${esc(r.name)} <span class="badge">${esc(stateOf(r))}</span><button data-open-record="${r.id}" data-patient="${p.id}" data-record-type="${r.type}">查看</button></div>`).join('')}${ms.map(m=>`<p>用药：${esc(m.name)} · 待下达</p>`).join('')}</section>`;}).join('')||'<p class="panel muted">暂无待办</p>'}`;}
function renderSettings(){screen.innerHTML=`<section class="panel"><h2>备份与恢复</h2><p>上次导出：${esc(db.lastBackup||'尚未导出')}</p><div class="actions"><button class="primary" data-action="export">导出完整备份</button><button data-action="import">导入恢复</button></div><p class="muted">备份包括患儿、检查检验、用药、任务、手写和可恢复删除记录。保存于本地浏览器；更换文件位置或清理浏览器数据可能影响读取，先导出备份。</p><p class="muted">本原型未加密。用于实机试用前请使用虚构资料。</p></section><section class="panel"><h2>可恢复删除记录</h2>${db.trash.map(p=>`<div class="record row"><span>${esc(p.bed)}床 <small>${esc(p.deletedAt?.slice(0,10)||'')}</small></span><button data-restore="${p.id}">恢复</button></div>`).join('')||'<p class="muted">暂无删除记录</p>'}</section><section class="panel"><h2>试用</h2><button data-action="demo">添加虚构示例患儿</button><p class="muted">新增独立“示例01”床，不覆盖已有记录。</p><p class="muted">版本 v0.1 · 单台设备 · 无网络请求 · HTML运行和 Pencil 须在实际 iPad 验证。</p></section>`;}
function download(name,data,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function backup(){const stamp=new Date().toISOString();const payload={...db,lastBackup:stamp};download('儿科查房备份-'+today+'.json',JSON.stringify(payload,null,2),'application/json');db.lastBackup=stamp;persist();if(view==='settings')render();toast('已发起备份下载，请确认文件已保存至“文件”App。');}
function importBackup(){openModal('导入备份',`<p>选择后先检查并预览，不会立即覆盖。</p><input type="file" id="import-file" accept=".json,application/json"><div id="import-preview"></div>`,()=>{$('#import-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());validate(d);$('#import-preview').innerHTML=`<p>版本 ${d.version}，患儿 ${d.patients.length}位，删除区 ${d.trash.length}份。</p><p class="error">恢复会替换现有数据，请先导出当前备份。</p><button id="before-import">先导出当前数据</button> <button id="commit-import" class="danger">确认替换并恢复</button>`;$('#before-import').onclick=backup;$('#commit-import').onclick=()=>{const previous=db,failed=loadFailed;db=d;loadFailed=false;if(!persist()){db=previous;loadFailed=failed;toast('恢复未写入成功，已保留当前内存数据。');return;}$('#modal').close();pid=null;view='home';render();toast('已恢复备份。');};}catch(e){$('#import-preview').textContent='无法导入：'+e.message;}};});}
function demo(){if(db.patients.some(p=>p.bed==='示例01'))return toast('示例床已存在。');const p={id:uid(),bed:'示例01',age:'3岁2月',diagnosis:'肺炎（虚构）',focus:'发热变化、进食情况',summary:'用于体验页面的虚构资料。',weight:'14',weightDate:today,created:today,days:{[today]:{change:'示例：今日精神及进食情况待复评。',ink:''}},tasks:[{id:uid(),text:'下午复评进食情况',date:today,done:false}],records:[{id:uid(),type:'lab',name:'血常规',category:'血液学',date:today,sampleDate:today,ordered:today,status:'已下达',summary:'虚构数值，仅供试用。',parts:[{id:uid(),name:'白细胞',state:'待阅',value:'9.8',unit:'×10⁹/L'},{id:uid(),name:'血红蛋白',state:'待结果',value:'',unit:'g/L'}]},{id:uid(),type:'exam',name:'胸部X线',category:'放射',date:today,ordered:today,status:'已下达',summary:'示例报告结论待录入。',parts:[{id:uid(),name:'胸部X线',state:'待阅',value:'',unit:''}]}],meds:[{id:uid(),name:'示例药物A（虚构）',dose:'示例剂量',frequency:'每日2次',route:'口服',start:today,ordered:today,issued:true,stop:null,history:[],initial:'示例剂量 · 每日2次 · 口服'}],monitor:[],monitorEnabled:false};db.patients.push(p);persist();goHome();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.action){const a=b.dataset.action;if(a==='home')goHome();if(a==='alltasks'){view='tasks';render();}if(a==='settings'){view='settings';render();}if(a==='addpatient')addPatient();if(a==='editpatient')editPatient();if(a==='deletepatient')deletePatient();if(a==='refreshheader')render();if(a==='addtask')addTask();if(a==='addmed')addMed();if(a==='addmonitor')addMonitor();if(a==='export')backup();if(a==='import')importBackup();if(a==='demo')demo();}if(b.dataset.filter){filter=b.dataset.filter;render();}if(b.dataset.open){pid=b.dataset.open;view='patient';tab='today';render();}if(b.dataset.tab){tab=b.dataset.tab;render();}if(b.dataset.neighbor!==undefined){pid=sorted()[+b.dataset.neighbor]?.id;render();}if(b.dataset.addRecord)addRecord(b.dataset.addRecord);if(b.dataset.editRecord)editRecord(b.dataset.editRecord);if(b.dataset.followRecord){const p=patient(),r=p.records.find(r=>r.id===b.dataset.followRecord);addTask(p,r.name);}if(b.dataset.openRecord){pid=b.dataset.patient;view='patient';tab=b.dataset.recordType;render();editRecord(b.dataset.openRecord);}if(b.dataset.adjustMed)changeMed(b.dataset.adjustMed);if(b.dataset.stopMed)changeMed(b.dataset.stopMed,true);if(b.dataset.restartMed)addMed(patient().meds.find(m=>m.id===b.dataset.restartMed));if(b.dataset.issueMed){patient().meds.find(m=>m.id===b.dataset.issueMed).issued=true;persist();render();}if(b.dataset.deleteMonitor){patient().monitor=patient().monitor.filter(r=>r.id!==b.dataset.deleteMonitor);persist();render();}if(b.dataset.restore){const p=db.trash.find(x=>x.id===b.dataset.restore);if(db.patients.some(x=>norm(x.bed).toLowerCase()===norm(p.bed).toLowerCase()))return toast('该床号已有新患儿，请先修改现有床号再恢复。');db.trash=db.trash.filter(x=>x.id!==p.id);delete p.deletedAt;db.patients.push(p);persist();render();toast('已恢复。');}});
document.addEventListener('change',e=>{if(e.target.dataset.task){const p=db.patients.find(p=>p.id===e.target.dataset.patient),t=p.tasks.find(t=>t.id===e.target.dataset.task);t.done=e.target.checked;persist();if(view==='tasks')render();}});
window.addEventListener('beforeunload',()=>{if(!loadFailed)persist();});
if(!loadFailed){$('#save-state').textContent='本地数据已读取';try{const test=KEY+'-probe';localStorage.setItem(test,'1');localStorage.removeItem(test);}catch(e){saveOK=false;$('#save-state').textContent='本地存储不可用 · 请导出备份';$('#save-state').classList.add('error');}}render();if(loadFailed)toast('读取原数据失败，已暂停写入。请导入有效备份，勿直接录入正式资料。');
</script></body></html>
